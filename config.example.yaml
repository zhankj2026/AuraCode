# AuraCode - 示例配置文件
# 复制此文件为 config.yaml 并根据需要修改

# LLM 配置
llm:
  # 智谱 GLM (推荐)
  provider: openai  # 使用 OpenAI 兼容接口
  model: glm-4-plus
  base_url: https://open.bigmodel.cn/api/paas/v4
  # api_key: "your-zhipu-api-key"  # 建议通过环境变量 OPENAI_API_KEY 设置
  
  # OpenAI (备选)
  # provider: openai
  # model: gpt-4o
  # base_url: https://api.openai.com/v1
  # api_key: "sk-your-openai-key"
  
  # 最大输出 token 数
  max_tokens: 32000
  temperature: 0.2
  # API 超时（秒）
  api_timeout: 300

# 权限配置
permissions:
  mode: normal  # normal, auto, plan, bypass
  allow_rules:
    - "run_command:ls"
    - "run_command:git status"
    - "read_file:*"
  deny_rules:
    - "run_command:rm -rf"
    - "run_command:sudo"

# Agent 配置
agent:
  max_iterations: 20
  context_window: 200000

# 上下文配置
context:
  load_project_md: true
  max_files_read: 10

# 日志配置
logging:
  level: INFO
