appId: com.auracode.desktop
productName: AuraCode
directories:
  output: dist
  buildResources: build
# NSIS installer compression. Default 'normal' leaves a lot on the table for a
# payload dominated by .py/.pyc/.dll; 'maximum' uses LZMA with a larger
# dictionary. Trades a slower build / slightly slower install for a noticeably
# smaller setup exe. (Complements the prune step in scripts/prune_python.py.)
compression: maximum
# Electron ships 55 locale .pak files (~38 MB) by default. The app UI is
# Chinese with English fallback, so keep just these two; the rest is dead
# weight that NSIS cannot compress further (.pak is already compressed).
electronLanguages:
  - zh-CN
  - en-US
# 只打包编译产物与描述文件；resources/ 下的 portable python 与 engine
# 通过 extraResources 单独拷进 <安装目录>/resources，避免被打进 app.asar
#（python 需要直接执行，engine 需被主进程 fs 读取、运行期可写）。
files:
  - filter:
      - out/**
      - package.json
extraResources:
  - from: resources/python
    to: python
  - from: resources/engine
    to: engine
win:
  target:
    - nsis
  artifactName: AuraCode-Setup-${version}.${ext}
  # 应用图标（决定 exe / 任务栏 / 开始菜单 / 桌面快捷方式的图标）。
  # build/ 被 .gitignore 忽略，故 icon.ico 用 git add -f 强制纳入跟踪，
  # 否则其它机器克隆后收不到图标、仍然回退到 Electron 默认图标。
  icon: build/icon.ico
  # ---- 代码签名（Authenticode / SmartScreen 通过） ----
  # 未配置证书时本段不生效，构建照常进行、不会报错。
  # 正式分发时通过环境变量注入证书（不要写死到仓库里）：
  #   CSC_LINK        = 证书 .pfx 文件路径或下载 URL
  #   CSC_KEY_PASSWORD= 证书私钥密码
  # 也可改用系统/CI 证书存储：设置 certificateSubjectName 为证书主体名。
  # rfc3161TimeStampServer + signingHashAlgorithms 仅在真正签名时生效，
  # 时间戳确保证书过期后旧安装包的签名仍被操作系统认可。
  rfc3161TimeStampServer: "http://timestamp.digicert.com"
  signingHashAlgorithms:
    - sha256
  # 可选：使用本机/CI 证书存储中的证书时取消下行注释并填入主体名
  # certificateSubjectName: "Your Company Name"
nsis:
  oneClick: false
  perMachine: false                     # 装到当前用户 AppData，避免 Program Files 写权限问题（python 运行期需写缓存/状态）
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AuraCode
  runAfterFinish: false                # 安装完成不自动运行，由用户自主选择
  installerIcon: build/icon.ico       # 安装器窗口图标
  uninstallerIcon: build/icon.ico     # 卸载器窗口图标
