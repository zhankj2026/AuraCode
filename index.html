<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雷电战机 - Thunder Fighter</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="800"></canvas>
        <div class="game-info">
            <h1>雷电战机</h1>
            <p>Thunder Fighter</p>
            <div class="controls">
                <h3>操作说明</h3>
                <ul>
                    <li>移动: WASD / 方向键</li>
                    <li>射击: 自动射击</li>
                    <li>暂停: P / ESC</li>
                    <li>菜单: 方向键 + Enter</li>
                </ul>
            </div>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
