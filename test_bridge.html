<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraCode Bridge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--s1:#161b22;--s2:#1c2128;--bd:#30363d;--tx:#e6edf3;--tx2:#8b949e;--acc:#58a6ff;--gn:#3fb950;--rd:#f85149;--yl:#d29922;--pp:#bc8cff}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column;overflow:hidden}
/* Top */
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--s1);border-bottom:1px solid var(--bd);flex-shrink:0}
.top h1{font-size:15px;font-weight:600;white-space:nowrap}
.top input{background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:4px 8px;border-radius:5px;font-size:12px}
.top input.u{width:180px}.top input.t{width:240px}
.top label{font-size:11px;color:var(--tx2)}
.b{padding:4px 12px;border-radius:5px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);cursor:pointer;font-size:12px;transition:.15s}
.b:hover{border-color:var(--acc);color:var(--acc)}.b.p{background:#238636;border-color:#238636;color:#fff}.b.p:hover{background:#2ea043}
.b.d{border-color:var(--rd);color:var(--rd)}.b.d:hover{background:rgba(248,81,73,.15)}.b.s{padding:2px 7px;font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px}
.dot.on{background:var(--gn);box-shadow:0 0 5px var(--gn)}.dot.off{background:var(--rd)}
/* Layout */
.main{display:flex;flex:1;overflow:hidden}
/* Left */
.left{width:250px;min-width:250px;border-right:1px solid var(--bd);display:flex;flex-direction:column;background:var(--s1);overflow:hidden}
.left .hd{padding:10px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.left .hd h2{font-size:13px}
.slist{flex:1;overflow-y:auto;padding:6px;min-height:0}
.sc{padding:8px;margin-bottom:5px;border-radius:7px;border:1px solid var(--bd);cursor:pointer;transition:.15s}
.sc:hover{border-color:var(--acc)}.sc.act{border-color:var(--acc);background:rgba(88,166,255,.08)}
.sc .sid{font-size:10px;color:var(--tx2);font-family:monospace}
.sc .tit{font-size:12px;margin:3px 0 2px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .meta{font-size:10px;color:var(--tx2);display:flex;gap:6px}
.bg{display:inline-block;padding:1px 5px;border-radius:8px;font-size:9px;font-weight:600}
.bg.idle{background:rgba(139,148,158,.2);color:var(--tx2)}.bg.running{background:rgba(63,185,80,.2);color:var(--gn)}
.bg.requires_action{background:rgba(210,153,34,.2);color:var(--yl)}.bg.completed{background:rgba(88,166,255,.2);color:var(--acc)}
.bg.failed{background:rgba(248,81,73,.2);color:var(--rd)}
.cform{padding:10px;border-top:1px solid var(--bd);flex-shrink:0}
.cform .r{display:flex;gap:5px;margin-bottom:5px}
.cform input,.cform select{background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:4px 7px;border-radius:4px;font-size:11px;flex:1;min-width:0}
/* Center */
.center{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.term{flex:1;overflow-y:auto;padding:12px 16px;font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:13px;line-height:1.6;background:#0a0e14}
.term .ln{margin-bottom:2px;white-space:pre-wrap;word-break:break-word}
.ln .prompt{color:var(--gn);font-weight:700}
.ln.user{color:#79c0ff}
.ln.think{color:var(--tx2);font-style:italic}
.ln.tool{color:var(--yl)}
.ln.result{color:var(--gn)}
.ln.error{color:var(--rd)}
.ln.sys{color:var(--tx2)}
.ln.info{color:var(--pp)}
.ln.ai{color:var(--tx)}
.ln .tag{display:inline-block;padding:0 5px;border-radius:3px;font-size:10px;font-weight:600;margin-right:4px}
.tag.exec{background:rgba(210,153,34,.2);color:var(--yl)}.tag.ok{background:rgba(63,185,80,.2);color:var(--gn)}
.tag.err{background:rgba(248,81,73,.2);color:var(--rd)}.tag.info{background:rgba(88,166,255,.15);color:var(--acc)}
/* Input bar */
.ibar{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--bd);background:var(--s1);align-items:flex-end}
.ibar textarea{flex:1;background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:7px 10px;border-radius:6px;font-size:13px;font-family:'Cascadia Code','Fira Code',monospace;resize:none;min-height:38px;max-height:100px}
.ibar textarea:focus{outline:none;border-color:var(--acc)}
/* Right */
.right{width:290px;min-width:290px;border-left:1px solid var(--bd);display:flex;flex-direction:column;background:var(--s1);overflow:hidden}
.right .hd{padding:10px;border-bottom:1px solid var(--bd);flex-shrink:0}
.right .hd h2{font-size:13px}
.fnav{padding:6px 10px;border-bottom:1px solid var(--bd);font-size:11px;color:var(--tx2);flex-shrink:0;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.fnav span{cursor:pointer;color:var(--acc)}.fnav span:hover{text-decoration:underline}.fnav .sep{color:var(--tx2);cursor:default}
.flist{flex:1;overflow-y:auto;padding:4px 0;min-height:0}
.fi{display:flex;align-items:center;gap:8px;padding:5px 10px;cursor:pointer;font-size:12px;transition:.1s}
.fi:hover{background:rgba(88,166,255,.06)}
.fi[draggable="true"]{cursor:grab}.fi[draggable="true"]:active{cursor:grabbing}
.fi .ic{width:16px;text-align:center;font-size:13px;flex-shrink:0}
.fi .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .sz{color:var(--tx2);font-size:10px;flex-shrink:0}
/* File viewer */
.fview{display:none;flex-direction:column;flex:1;overflow:hidden}
.fview.show{display:flex}
.fview .vh{padding:6px 10px;border-bottom:1px solid var(--bd);font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:6px;flex-shrink:0}
.fview .vh .back{cursor:pointer;color:var(--acc)}.fview .vh .back:hover{text-decoration:underline}
.fview pre{flex:1;overflow:auto;padding:10px;font-family:'Cascadia Code','Fira Code',monospace;font-size:11px;line-height:1.5;color:var(--tx);margin:0;background:var(--bg)}
.fview pre .lnum{color:var(--tx2);display:inline-block;width:35px;text-align:right;margin-right:10px;user-select:none}
/* Perm */
.pov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;justify-content:center;align-items:center}
.pov.show{display:flex}
.pdlg{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:18px;width:460px;max-width:90vw}
.pdlg h3{font-size:14px;margin-bottom:10px;color:var(--yl)}
.pdlg .inf{background:var(--bg);padding:10px;border-radius:6px;margin-bottom:14px;font-size:12px}
.pdlg .inf .rw{display:flex;gap:6px;margin-bottom:3px}.pdlg .inf .k{color:var(--tx2);min-width:55px}
.pdlg .act{display:flex;gap:8px;justify-content:flex-end}
/* Network tab */
.net-wrap{flex:1;overflow-y:auto;padding:8px 12px;font-size:12px}
.net-summary{display:flex;gap:16px;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--s1);font-size:11px;color:var(--tx2);flex-shrink:0}
.net-summary .ns{display:flex;align-items:center;gap:4px}
.net-summary .ns b{color:var(--tx);font-size:12px}
.net-tbl{width:100%;border-collapse:collapse;font-family:'Cascadia Code','Fira Code',monospace;font-size:11px}
.net-tbl th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);color:var(--tx2);font-weight:600;position:sticky;top:0;background:var(--bg);z-index:1}
.net-tbl td{padding:5px 8px;border-bottom:1px solid rgba(48,54,61,.5);cursor:pointer;vertical-align:top}
.net-tbl tr:hover td{background:rgba(88,166,255,.06)}
.net-tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.net-tbl .ok{color:var(--gn)}.net-tbl .warn{color:var(--yl)}.net-tbl .err{color:var(--rd)}
.net-detail{display:none;background:var(--s2);border:1px solid var(--bd);border-radius:6px;margin:4px 8px;padding:10px;font-size:11px;line-height:1.6}
.net-detail.show{display:block}
.net-detail .lbl{color:var(--tx2);min-width:120px;display:inline-block}
.net-detail pre{background:var(--bg);padding:8px;border-radius:4px;overflow-x:auto;font-size:10px;margin:4px 0 8px;max-height:200px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
/* Activity indicator in status bar */
.sbar .activity{color:var(--yl);transition:opacity .3s;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar .activity.fade{opacity:0}
/* Tool result context */
.ln .ctx{color:var(--tx2);font-size:11px;margin-left:6px}
/* Result stats */
.result-stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;font-size:11px;color:var(--tx2)}
.result-stats .rs{display:flex;align-items:center;gap:3px}
.result-stats .rs b{color:var(--tx);font-size:12px}
/* Status */
.sbar{display:flex;align-items:center;gap:14px;padding:5px 14px;background:var(--s1);border-top:1px solid var(--bd);font-size:10px;color:var(--tx2);flex-shrink:0}
.ph{display:flex;align-items:center;justify-content:center;height:100%;color:var(--tx2);font-size:13px;flex-direction:column;gap:6px}
.ctab{padding:8px 18px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--tx2);transition:.15s}
.ctab:hover{color:var(--tx)}.ctab.active{color:var(--acc);border-bottom-color:var(--acc)}
.ctab .count{background:var(--bd);padding:0 5px;border-radius:8px;font-size:10px;margin-left:4px}
/* Drag overlay */
.drag-ov{display:none;position:absolute;inset:0;background:rgba(88,166,255,.12);border:2px dashed var(--acc);border-radius:8px;z-index:50;justify-content:center;align-items:center;font-size:14px;color:var(--acc);font-weight:600;pointer-events:none}
.drag-ov.show{display:flex}
/* Attachment chips */
.atchips{display:flex;flex-wrap:wrap;gap:4px;padding:4px 12px 0;min-height:0}
.atchip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.3);border-radius:12px;font-size:11px;color:var(--acc);max-width:200px}
.atchip .x{cursor:pointer;color:var(--tx2);font-size:13px;margin-left:2px}.atchip .x:hover{color:var(--rd)}
.atchip .ic{font-size:12px;flex-shrink:0}
.atchip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
/* @ Popup */
.atpop{display:none;position:absolute;bottom:100%;left:12px;right:12px;max-height:220px;background:var(--s1);border:1px solid var(--bd);border-radius:8px;overflow-y:auto;z-index:60;box-shadow:0 -4px 16px rgba(0,0,0,.4)}
.atpop.show{display:block}
.atpop .hd{padding:6px 10px;font-size:10px;color:var(--tx2);border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--s1)}
.atpop .fi{padding:6px 10px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(48,54,61,.3)}
.atpop .fi:hover,.atpop .fi.sel{background:rgba(88,166,255,.1)}
.atpop .fi .ic{width:16px;text-align:center;font-size:13px;flex-shrink:0}
.atpop .fi .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atpop .fi .sz{color:var(--tx2);font-size:10px;flex-shrink:0}
.atpop .fi .pth{color:var(--tx2);font-size:10px;margin-left:4px}
.atpop .empty{padding:12px;text-align:center;color:var(--tx2);font-size:12px}
</style>
</head>
<body>
<div class="top">
  <h1>🔌 AuraCode Bridge</h1>
  <label>URL</label><input id="sUrl" class="u" value="http://127.0.0.1:8765">
  <label>Token</label><input id="sTok" class="t" value="" placeholder="Bearer Token">
  <button class="b p" onclick="connect()">连接</button>
  <button class="b" onclick="disconnect()">断开</button>
  <span id="wsSt"><span class="dot off"></span>未连接</span>
</div>
<div class="main">
  <!-- Left: Sessions -->
  <div class="left">
    <div class="hd"><h2>📋 会话</h2><button class="b s" onclick="refreshSessions()">刷新</button></div>
    <div class="slist" id="sList"><div class="ph">未连接</div></div>
    <div class="cform">
      <div class="r"><input id="nDir" placeholder="工作目录 (.)"><input id="nModel" placeholder="模型"></div>
      <div class="r"><input id="nKey" placeholder="API Key" type="password"><input id="nBase" placeholder="Base URL"></div>
      <div class="r">
        <select id="nPerm"><option value="auto">auto</option><option value="normal">normal</option><option value="bypass">bypass</option><option value="plan">plan</option></select>
        <button class="b p" onclick="createSession()">+ 新建</button>
      </div>
    </div>
  </div>
  <!-- Center: Terminal + Network -->
  <div class="center">
    <div class="tabs" style="display:flex;border-bottom:1px solid var(--bd);background:var(--s1);flex-shrink:0">
      <div class="ctab active" data-ct="term" onclick="switchCTab('term')">💬 终端</div>
      <div class="ctab" data-ct="net" onclick="switchCTab('net')">📡 网络<span class="count" id="netCount">0</span></div>
    </div>
    <div id="cpane-term" style="flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative">
      <div class="term" id="term"><div class="ph">选择或创建会话开始对话</div></div>
      <div class="atchips" id="atChips"></div>
      <div class="atpop" id="atPop"><div class="hd">输入 @ 搜索文件，Esc 关闭</div><div class="empty">输入关键字搜索文件...</div></div>
      <div class="drag-ov" id="dragOv">📎 拖放文件以上传</div>
      <div class="ibar">
        <textarea id="inp" placeholder="输入消息... (@引用文件, Enter发送, Shift+Enter换行)" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}" oninput="onInpInput(event)" onpaste="onPaste(event)"></textarea>
        <button class="b p" onclick="send()">发送</button>
        <button class="b" onclick="interrupt()">中断</button>
        <button class="b d" onclick="stopSess()">停止</button>
      </div>
    </div>
    <div id="cpane-net" style="flex:1;display:none;flex-direction:column;overflow:hidden">
      <div class="net-summary">
        <div class="ns">调用: <b id="netCalls">0</b></div>
        <div class="ns">总Token: <b id="netTokens">0</b></div>
        <div class="ns">总耗时: <b id="netTime">0s</b></div>
        <div style="margin-left:auto"><button class="b s" onclick="clearNetwork()">清空</button></div>
      </div>
      <div class="net-wrap" id="netWrap"><div class="ph" style="font-size:12px">等待 LLM 请求...</div></div>
    </div>
  </div>
  <!-- Right: File Browser -->
  <div class="right">
    <div class="hd">
      <h2>📁 文件浏览器</h2>
      <div style="float:right;display:flex;gap:4px;margin-top:-2px">
        <button class="b s" onclick="createFolder()" title="新建文件夹">📁+</button>
        <button class="b s" onclick="uploadFile()" title="上传文件">📤</button>
        <button class="b s" onclick="refreshFiles()" title="刷新">🔄</button>
      </div>
    </div>
    <div class="fnav" id="fnav"><span onclick="browseTo('')">📂 根目录</span></div>
    <div class="flist" id="flist"><div class="ph" style="font-size:12px">选择会话后浏览文件</div></div>
    <div class="fview" id="fview">
      <div class="vh"><span class="back" onclick="closeFileView()">← 返回</span><span id="fvName"></span></div>
      <pre id="fvContent"></pre>
    </div>
  </div>
</div>
<!-- Permission -->
<div class="pov" id="pOv">
  <div class="pdlg">
    <h3>🔐 权限审批</h3>
    <div class="inf" id="pInf"></div>
    <div class="act">
      <button class="b d" onclick="permResp('deny')">❌ 拒绝</button>
      <button class="b p" onclick="permResp('allow')">✅ 允许</button>
    </div>
  </div>
</div>
<div class="sbar">
  <span id="sb1">未连接</span><span id="sb2"></span><span id="sbActivity" class="activity"></span><span id="sb3">事件: 0</span>
  <span id="planModeIndicator" style="display:none;margin-left:8px;padding:2px 8px;background:#d29922;border-radius:10px;color:#fff;font-size:11px;font-weight:600">📝 Plan Mode</span>
  <button id="btnExitPlan" onclick="exitPlanMode()" style="display:none;margin-left:8px;padding:2px 8px;background:#238636;border:1px solid #2ea043;border-radius:4px;color:#fff;cursor:pointer;font-size:11px">🚪 退出</button>
  <span style="margin-left:auto" id="sb4"></span>
</div>
<script>
let ws=null,sess={},asid=null,evts=[],rnd=0,pPerm=null;
let dedup=new Set(),tcDedup=new Set(),trDedup=new Set();
let fileRoot='', filePath='';
let netCalls=[],netTotalTokens=0,netTotalMs=0;
// ── Activity tracking (P2) ──
let lastToolSummary=null, lastToolTime=0;
const TOOL_DISPLAY_EXPIRY_MS=30000;
// ── Tool stats per session (P3) ──
let toolStats={}; // {tool_name: {count, success, failed}}
// ── TOOL_VERBS mapping (P0) ──
const TOOL_VERBS={
  read_file:'Reading',write_file:'Writing',replace_in_file:'Editing',
  run_command:'Running',run_powershell:'Running',run_bash:'Running',
  glob:'Searching',grep:'Searching',find:'Searching',
  web_fetch:'Fetching',web_search:'Searching',
  notebook_edit:'Editing notebook',lsp:'Analyzing',
  todo_write:'Planning',task_create:'Creating task',task_update:'Updating task',
  task_list:'Listing tasks',task_get:'Getting task',task_stop:'Stopping task',
  list_directory:'Browsing',sleep:'Waiting',config_tool:'Configuring',
  brief_tool:'Toggling brief',ask_user:'Asking',
  enter_plan_mode:'Entering plan',exit_plan_mode:'Exiting plan',
  file_history:'Viewing history',search_files:'Searching',
  mcp_invoke:'Calling MCP',worktree_enter:'Creating worktree',worktree_exit:'Exiting worktree',
  cron_create:'Scheduling',cron_delete:'Removing cron',cron_list:'Listing crons',
};
// ── toolSummary: extract most relevant target from tool args (P0+P1) ──
function toolSummary(toolName, args){
  const verb=TOOL_VERBS[toolName]||toolName;
  if(!args)return verb;
  const a=typeof args==='string'?(tryParse(args)||{}):args;
  const target=a.file_path||a.filePath||a.path||a.pattern||a.url||a.query||
    (a.command||'').substring(0,60)||a.content?.substring(0,40)||'';
  return target?`${verb} ${target}`:verb;
}
function tryParse(s){try{return JSON.parse(s)}catch{return null}}
// ── updateActivity: show tool activity in status bar (P2) ──
function updateActivity(summary){
  lastToolSummary=summary;lastToolTime=Date.now();
  const el=$('sbActivity');
  el.textContent='⚡ '+summary;el.classList.remove('fade');
}
function clearActivityIfExpired(){
  if(lastToolSummary&&Date.now()-lastToolTime>TOOL_DISPLAY_EXPIRY_MS){
    const el=$('sbActivity');el.classList.add('fade');
    setTimeout(()=>{if(Date.now()-lastToolTime>TOOL_DISPLAY_EXPIRY_MS){el.textContent='';lastToolSummary=null;}},300);
  }
}
setInterval(clearActivityIfExpired,5000);
// ── trackTool: accumulate tool stats (P3) ──
function trackTool(name,success){
  if(!toolStats[name])toolStats[name]={count:0,success:0,failed:0};
  toolStats[name].count++;
  if(success!==false)toolStats[name].success++;else toolStats[name].failed++;
}
const $=id=>document.getElementById(id),now=()=>new Date().toLocaleTimeString('zh-CN',{hour12:false}),short=s=>s.substring(0,8);
function url(){return $('sUrl').value.replace(/\/$/,'')}
function tok(){return $('sTok').value}
function hd(){return{'Authorization':`Bearer ${tok()}`,'Content-Type':'application/json'}}
async function api(m,p,body){const o={method:m,headers:hd()};if(body)o.body=JSON.stringify(body);const r=await fetch(url()+p,o);if(!r.ok)throw new Error(`${r.status}: ${await r.text()}`);return r.json()}
// ── WS ──
function connect(){
  disconnect();const u=url(),w=u.replace(/^http/,'ws')+`/ws/events?token=${tok()}`;
  ws=new WebSocket(w);
  ws.onopen=()=>{$('wsSt').innerHTML='<span class="dot on"></span>已连接';$('sb1').textContent='✅ 已连接';tln('sys','── WebSocket 已连接 ──');refreshSessions()};
  ws.onclose=e=>{$('wsSt').innerHTML='<span class="dot off"></span>已断开';$('sb1').textContent='❌ 已断开';tln('sys',`── 连接断开 (code=${e.code}) ──`)};
  ws.onerror=()=>{$('wsSt').innerHTML='<span class="dot off"></span>错误'};
  ws.onmessage=e=>{try{handle(JSON.parse(e.data))}catch(err){console.error(err)}};
}
function disconnect(){if(ws){ws.close();ws=null}}
// ── Terminal output ──
function tln(cls,text,tag,isHtml){
  const el=$('term'),ph=el.querySelector('.ph');if(ph)ph.remove();
  const d=document.createElement('div');d.className='ln '+cls;

// 终结当前流式元素：移除 .streaming 类，使其不再被后续事件误判

// ── Events ──
function handle(e){
  evts.push(e);$('sb3').textContent=`事件: ${evts.length}`;
  if(e.session_id&&['session_created','session_started','session_stopped','session_error','result','turn_complete','aborted'].includes(e.type))refreshSessions();
  if(e.session_id!==asid)return;
  switch(e.type){
    case'turn_start':{
      // 新 turn 开始前，先终结上一轮的流式元素（防御性清理）
      finalizeStreaming();
      rnd=e.data.turn||(rnd+1);
      tln('think',`🤔 思考中... (轮次 ${rnd})`);
      break}
    case'turn_complete':{
      // Turn 完成：终结流式元素，标记本轮文本输出结束
      finalizeStreaming();
      break}
    case'text_chunk':{
      // Token 级流式输出 — 打字机效果
      const content = e.data.content || '';
      if (content) {
        // 查找或创建当前 AI 消息元素（必须有 .streaming 类才算"活跃"）
        let aiEl = document.querySelector('.ln.ai.streaming');
        if (!aiEl) {
          // 创建新的流式消息元素
          aiEl = document.createElement('div');
          aiEl.className = 'ln ai streaming';
          aiEl.textContent = '🤖 Assistant: ';
          $('term').appendChild(aiEl);
        }
        // 追加文本内容
        aiEl.textContent += content;
        // 滚动到底部
        $('term').scrollTop = $('term').scrollHeight;
      }
      break}
    case'tool_execute':{
      // 工具执行前，先终结当前流式元素（工具调用意味着本轮 LLM 文本输出结束）
      finalizeStreaming();
      const tn=e.data.tool_name||'?';
      // P0: 语义化显示 (动词 + 目标)
      const summary=toolSummary(tn,e.data.arguments);
      tln('tool',`⚡ ${summary}`,'exec');
      // P2: 更新状态栏活动指示
      updateActivity(summary);
      // P3: 追踪工具统计
      trackTool(tn,true);
      // 检测 Plan Mode 进入
      if (tn === 'enter_plan_mode') {
        isPlanMode = true;
        updatePlanModeUI();
        tln('info', '📝 进入 Plan Mode（只读模式，仅允许写入计划文件）', 'info');
      }
      break}
    case'tool_complete':{
      const tn=e.data.tool_name||'?',ok=e.data.success!==false;
      // P1: 显示工具结果上下文（大小/行数等）
      const result=e.data.result||{};
      let ctxStr='';
      if(typeof result==='object'&&result!==null){
        const parts=[];
        if(result.size!==undefined)parts.push(fmtSize(result.size));
        if(result.lines!==undefined)parts.push(`${result.lines}行`);
        if(result.line_count!==undefined)parts.push(`${result.line_count}行`);
        if(result.file_count!==undefined)parts.push(`${result.file_count}个文件`);
        if(result.char_count!==undefined)parts.push(`${result.char_count}字符`);
        if(result.match_count!==undefined)parts.push(`${result.match_count}个匹配`);
        if(result.truncated)parts.push('⚠️已截断');
        if(parts.length)ctxStr=`<span class="ctx">(${parts.join(', ')})</span>`;
      }
      // P3: 追踪失败
      if(!ok)trackTool(tn,false);
      tln(ok?'result':'error',`${ok?'✅':'❌'} ${TOOL_VERBS[tn]||tn} ${ok?'完成':'失败'} ${ctxStr}`,ok?'ok':'err',true);
      // 检测 Plan Mode 退出
      if (tn === 'exit_plan_mode' && ok) {
        isPlanMode = false;
        updatePlanModeUI();
        tln('info', '🚪 退出 Plan Mode', 'info');
      }
      break}
    case'assistant_message':{
      // 如果当前有活跃的流式输出（.streaming 类），则不重复显示
      const c=e.data.content||'',h=c.substring(0,200);
      if(dedup.has(h) || document.querySelector('.ln.ai.streaming'))break;
      dedup.add(h);
      tln('ai',c);break}
    case'tool_call':{
      const id=e.data.tool_call_id;if(id&&tcDedup.has(id))break;if(id)tcDedup.add(id);
      const tn=e.data.tool_name||'?',args=fmtJ(e.data.arguments);
      tln('sys',`🔧 ${tn}\n${args}`);break}
    case'tool_result':{
      const id=e.data.tool_call_id;if(id&&trDedup.has(id))break;if(id)trDedup.add(id);
      tln('sys',`📋 ${(e.data.content||'').substring(0,400)}`);break}
    case'result':finalizeStreaming();showResult(e);break;
    // output 事件不再展示（已由 text_chunk/assistant_message/result.summary 覆盖）
    case'context_compacted':tln('info',`🗜️ 上下文压缩: ${e.data.messages_before} → ${e.data.messages_after} 条`,'info');break;
    case'fallback_activated':tln('error',`⚠️ 备用模型: ${e.data.model}`,'err');break;
    case'api_retry':tln('sys',`⚠️ API重试 (${e.data.attempt}/${e.data.max_retries}): ${e.data.error}`);break;
    case'turn_retry':tln('sys',`⚠️ 轮次重试: ${e.data.error}`);break;
    case'prompt_too_long_recovery':tln('info','⚠️ Prompt过长，压缩重试','info');break;
    case'aborted':tln('error','🛑 执行已中断','err');break;
    case'interrupted':tln('info','🛑 Turn 被中断（会话保持活跃）','info');break;
    case'model_changed':tln('info',`🔄 模型切换: ${e.data.old_model} → ${e.data.new_model}`,'info');break;
    case'session_archived':tln('sys',`📦 会话已归档 (${e.data.message_count} 条消息)`);break;
    case'llm_call':addNetCall(e.data);break;
    case'server_shutting_down':tln('error','⚠️ 服务器正在关闭...','err');break;
    case'permission_request':showPerm(e);break;
    case'cron_triggered':{
      tln('info', `📅 Cron 任务触发: ${e.data.job_id} - ${e.data.prompt.substring(0, 50)}...`, 'info');
      break}
    case'cron_completed':{
      const ok = e.data.success;
      tln(ok?'result':'error', `${ok?'✅':'❌'} Cron 任务完成: ${e.data.job_id}`, ok?'ok':'err');
      if (e.data.summary) tln('sys', `   摘要: ${e.data.summary}`);
      if (e.data.error) tln('error', `   错误: ${e.data.error}`);
      break}
    case'validation_failed':{
      tln('error', `⚠️ 代码验证失败: ${e.data.file_path}`, 'err');
      if (e.data.summary) tln('error', `   ${e.data.summary}`);
      break}
  }
}
function showResult(e){
  const d=e.data,st=d.status||(d.success?'success':'error'),nt=d.num_turns||'?',dur=d.duration_ms?` ${(d.duration_ms/1000).toFixed(1)}s`:'';
  // P3: stop_reason 展示
  const sr=d.stop_reason||'';
  const srLabel=sr?{end_turn:'正常结束',max_tokens:'Token上限',stop_sequence:'停止序列',tool_calls:'工具完成'}[sr]||sr:'';
  // P3: 工具统计摘要
  const tNames=Object.keys(toolStats);
  const tTotal=tNames.reduce((s,n)=>s+toolStats[n].count,0);
  const tFailed=tNames.reduce((s,n)=>s+toolStats[n].failed,0);
  // 无总结时仅显示简洁状态行
  if(!d.summary){
    tln('','');
    let statusLine=`── ${st==='success'?'✅':'❌'} ${st} | ${nt} 轮${dur}`;
    if(srLabel)statusLine+=` | ${srLabel}`;
    if(tTotal)statusLine+=` | 🔧 ${tTotal} 次调用`+(tFailed?` (${tFailed} 失败)`:'');
    statusLine+=' ──';
    tln('sys',statusLine);
    // 显示工具统计详情
    if(tTotal>1){
      const parts=tNames.map(n=>`${TOOL_VERBS[n]||n}×${toolStats[n].count}`);
      tln('sys',`   ${parts.join(' · ')}`);
    }
    tln('','');
    return;
  }
  // 有总结时显示完整总结框
  tln('','');
  let header=`┌─ ${st==='success'?'✅':'❌'} ${nt} 轮${dur}`;
  if(srLabel)header+=` | ${srLabel}`;
  header+=' ─────────';
  tln('sys',header);
  tln('sys',`│ 📋 会话总结:`);
  d.summary.split('\n').forEach(line=>{
    if(line.trim())tln('sys',`│ ${line}`);
  });
  // P3: 工具统计
  if(tTotal){
    const parts=tNames.map(n=>`${TOOL_VERBS[n]||n}×${toolStats[n].count}`);
    tln('sys',`│ 🔧 工具: ${parts.join(' · ')}`+(tFailed?` (${tFailed} 失败)`:''));
  }
  tln('sys','└───────────────────────────');
  tln('','');
}

async function uploadFile(){

  const input=document.createElement('input');
  input.type='file';
  input.multiple=true;
  input.onchange=async()=>{
    for(const file of input.files){
      try{
        const isText=file.type.startsWith('text/')||/\.(md|txt|json|js|ts|tsx|jsx|py|go|rs|java|c|cc|cpp|h|hpp|css|html|xml|yml|yaml|toml|ini|sh|sql|csv|log|bat|ps1)$/i.test(file.name);
        const reader=new FileReader();
        // 启动读取必须在 await 之前（放入 executor 内），否则 onload 永不触发 → 死锁
        const content=await new Promise((resolve,reject)=>{
          reader.onload=()=>resolve(reader.result);
          reader.onerror=reject;
          if(isText)reader.readAsText(file);else reader.readAsDataURL(file);
        });
        const path=filePath?(filePath+'/'+file.name):file.name;
        const type=isText?'file':'image';
        await api('POST',`/api/sessions/${asid}/files`,{
          path:path,
          content:content,
          type:type
        });
        tln('sys',`📤 已上传: ${file.name}`);
      }catch(e){alert('上传失败: '+file.name+' - '+e.message)}
    }
    refreshFiles();
  };

  const tr=document.createElement('tr');

  tr.innerHTML=`<td class="num">${idx}</td><td>${esc(rq.model||'?')}</td><td class="num">${rq.message_count||0}</td><td>${esc(toolNames)}</td><td class="num ${durCls}">${(dur/1000).toFixed(1)}s</td><td class="num">${fmtNum(tk)}</td><td class="${cls}">${rs.finish_reason||'?'}</td>`;
  tr.onclick=function(){toggleDetail('nd-'+idx,this)};
  tbody.appendChild(tr);
  // Detail row
  const detTr=document.createElement('tr');detTr.id='nd-'+idx;
  detTr.innerHTML=`<td colspan="7"><div class="net-detail"><div><span class="lbl">轮次/尝试:</span> turn ${d.turn||'?'}, attempt ${d.attempt||1}</div><div><span class="lbl">请求参数:</span></div><pre>model: ${esc(rq.model||'')}
messages: ${rq.message_count||0} 条
tools: ${rq.tool_count||0} 个
temperature: ${rq.temperature}
max_tokens: ${rq.max_tokens}</pre><div><span class="lbl">响应数据:</span></div><pre>finish_reason: ${rs.finish_reason||'N/A'}
content: ${rs.content_length||0} 字符
tool_calls: ${rs.tool_calls||0}${rs.tool_names?' ('+rs.tool_names.join(', ')+')':''}
prompt_tokens: ${fmtNum(rs.prompt_tokens||0)}
completion_tokens: ${fmtNum(rs.completion_tokens||0)}
total_tokens: ${fmtNum(rs.total_tokens||0)}${rs.has_reasoning?'\nreasoning: '+rs.reasoning_length+' 字符':''}</pre>${rs.content_preview?'<div><span class="lbl">内容预览:</span></div><pre>'+esc(rs.content_preview)+'</pre>':''}</div></td>`;
  detTr.style.display='none';tbody.appendChild(detTr);
  el.scrollTop=el.scrollHeight;
}
function toggleDetail(id,tr){
  const det=document.getElementById(id);if(!det)return;
  const show=det.style.display==='none';
  // Hide all other details
  document.querySelectorAll('.net-detail.show').forEach(d=>{d.classList.remove('show');d.parentElement.style.display='none'});
  if(show){det.style.display='';det.querySelector('.net-detail').classList.add('show')}
}
function clearNetwork(){netCalls=[];netTotalTokens=0;netTotalMs=0;
  $('netCalls').textContent='0';$('netTokens').textContent='0';$('netTime').textContent='0s';$('netCount').textContent='0';
  $('netWrap').innerHTML='<div class="ph" style="font-size:12px">等待 LLM 请求...</div>';}
function fmtNum(n){if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n)}
// ── Permission ──
function showPerm(e){
  pPerm={session_id:e.session_id,request_id:e.data.request_id,tool_name:e.data.tool_name,options:e.data.tool_input.options||[]};
  const isAskUser = e.data.tool_name === 'ask_user';
  
  if (isAskUser) {
    // ask_user 工具：显示问题和选项
    const q = e.data.tool_input.question || '';
    const opts = e.data.tool_input.options || [];
    const multi = e.data.tool_input.multi_select || false;
    
    let html = `<div style="font-size:14px;font-weight:500;margin-bottom:12px;color:var(--tx)">${esc(q)}</div>`;
    if (multi) html += `<div style="font-size:11px;color:var(--tx2);margin-bottom:8px">（可多选）</div>`;
    
    html += `<div style="display:flex;flex-direction:column;gap:8px">`;
    opts.forEach((opt, i) => {
      const label = opt.label || `选项 ${i+1}`;
      const desc = opt.description || '';
      html += `<button class="b" style="text-align:left;padding:10px 12px;white-space:normal;height:auto" onclick="selectAskUserOption(${i})">
        <div style="font-weight:500">${esc(label)}</div>
        ${desc ? `<div style="font-size:11px;color:var(--tx2);margin-top:4px">${esc(desc)}</div>` : ''}
      </button>`;
    });
    html += `</div>`;
    html += `<div style="margin-top:12px;display:flex;gap:8px">
      <input id="askUserOther" placeholder="或其他..." style="flex:1;background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:6px 10px;border-radius:5px;font-size:12px">
      <button class="b p" onclick="submitAskUserOther()">提交</button>
    </div>`;
    
    $('pInf').innerHTML = html;
    $('pOv').querySelector('h3').textContent = '🤔 请选择';
    // 隐藏默认的允许/拒绝按钮
    $('pOv').querySelector('.act').style.display = 'none';
  } else {
    // 普通权限请求
    $('pInf').innerHTML=`<div class="rw"><span class="k">会话:</span><span>${short(e.session_id)}</span></div><div class="rw"><span class="k">工具:</span><span>${esc(e.data.tool_name)}</span></div><div class="rw"><span class="k">描述:</span><span>${esc(e.data.description)}</span></div><pre style="background:var(--bg);padding:6px;border-radius:4px;font-size:10px;margin-top:4px;overflow-x:auto">${esc(JSON.stringify(e.data.tool_input,null,2))}</pre>`;
    $('pOv').querySelector('h3').textContent = '🔐 权限审批';
    $('pOv').querySelector('.act').style.display = '';
  }
  $('pOv').classList.add('show');
}

function selectAskUserOption(idx) {
  if (!pPerm) return;
  const opt = pPerm.options ? pPerm.options[idx] : null;
  const label = opt ? opt.label : `选项 ${idx+1}`;
  // 发送选择结果
  permRespWithMessage('allow', label);
}

function submitAskUserOther() {
  if (!pPerm) return;
  const other = $('askUserOther').value.trim();
  if (!other) return;
  permRespWithMessage('allow', other);
}

async function permRespWithMessage(b, msg) {
  if(!pPerm)return;
  try{
    await api('POST',`/api/sessions/${pPerm.session_id}/permission`,{
      request_id:pPerm.request_id,
      behavior:b,
      message: msg || ''
    });
    tln('sys',`🔐 用户选择: ${msg}`);
  }catch(e){alert(e.message)}
  $('pOv').classList.remove('show');
  $('pOv').querySelector('.act').style.display = '';
  pPerm=null;
}

async function permResp(b){if(!pPerm)return;try{await api('POST',`/api/sessions/${pPerm.session_id}/permission`,{request_id:pPerm.request_id,behavior:b});tln('sys',`🔐 权限: ${b==='allow'?'✅ 允许':'❌ 拒绝'}`)}catch(e){alert(e.message)}$('pOv').classList.remove('show');$('pOv').querySelector('.act').style.display = '';pPerm=null}

// ── Plan Mode ──
let isPlanMode = false;

function updatePlanModeUI() {
  $('planModeIndicator').style.display = isPlanMode ? 'inline-block' : 'none';
  $('btnExitPlan').style.display = isPlanMode ? 'inline-block' : 'none';
}

async function exitPlanMode() {
  if (!asid) { alert('请先选择会话'); return; }
  if (!confirm('确定要退出 Plan Mode 吗？')) return;
  try {
    // 发送 exit_plan_mode 命令
    await api('POST', `/api/sessions/${asid}/message`, { content: '/exit_plan_mode' });
    tln('sys', '🚪 发送退出 Plan Mode 命令...');
    isPlanMode = false;
    updatePlanModeUI();

    alert('退出失败: ' + e.message);

// ── Utils ──
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fmtJ(s){try{return JSON.stringify(JSON.parse(s),null,2)}catch{return String(s||'')}}
$('inp').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'});
setInterval(()=>{$('sb4').textContent=now()},1000);$('sb4').textContent=now();

// ── P0+P1: 拖拽上传 + 粘贴图片 + @引用 ──
let pendingAttachments=[]; // [{name, path, type, content?, size?}]
let atPopVisible=false, atPopQuery='', atPopSelIdx=0, atPopResults=[], atPopDebounce=null;

// ── 附件管理 ──
function addAttachment(att){
  // 去重：同 path 不重复添加
  if(att.path && pendingAttachments.some(a=>a.path===att.path))return;
  pendingAttachments.push(att);
  renderChips();
}
function removeAttachment(idx){
  pendingAttachments.splice(idx,1);
  renderChips();
}
function renderChips(){
  const el=$('atChips');
  if(!pendingAttachments.length){el.innerHTML='';return;}
  el.innerHTML=pendingAttachments.map((a,i)=>{
    const ic=a.type==='image'?'🖼️':fileIcon(a.name);
    return`<span class="atchip"><span class="ic">${ic}</span><span class="nm">${esc(a.name)}</span><span class="x" onclick="removeAttachment(${i})">×</span></span>`;
  }).join('');
}

// ── P0: 拖拽上传 ──
(function initDrag(){
  const pane=document.getElementById('cpane-term');
  if(!pane)return;
  let dragCtr=0;
  pane.addEventListener('dragenter',e=>{e.preventDefault();dragCtr++;$('dragOv').classList.add('show')});
  pane.addEventListener('dragleave',e=>{e.preventDefault();dragCtr--;if(dragCtr<=0){dragCtr=0;$('dragOv').classList.remove('show')}});
  pane.addEventListener('dragover',e=>{e.preventDefault()});
  pane.addEventListener('drop',async e=>{
    e.preventDefault();dragCtr=0;$('dragOv').classList.remove('show');
    if(!asid){alert('请先选择会话');return;}
    // 内部拖拽：从右侧文件浏览器拖入的已有文件（引用，不重新上传）
    const internal=e.dataTransfer.getData('text/x-bridge-file');
    if(internal){
      try{
        const info=JSON.parse(internal);
        addAttachment({name:info.name,path:info.path,type:'file',size:info.size||0});
        tln('sys',`📎 引用文件: ${info.name}（${info.path}）`);
      }catch(err){console.error('内部拖拽解析失败',err)}
      return;
    }
    // 外部拖拽：操作系统文件（需上传）
    const files=e.dataTransfer.files;
    for(const f of files){
      try{
        const isText=f.type.startsWith('text/')||/\.(md|txt|json|js|ts|tsx|jsx|py|go|rs|java|c|cc|cpp|h|hpp|css|html|xml|yml|yaml|toml|ini|sh|sql|csv|log|bat|ps1)$/i.test(f.name);
        const reader=new FileReader();
        // 启动读取必须在 await 之前（放入 executor 内），否则 onload 永不触发 → 死锁
        const content=await new Promise((res,rej)=>{
          reader.onload=()=>res(reader.result);
          reader.onerror=rej;
          if(isText)reader.readAsText(f);else reader.readAsDataURL(f);
        });
        const type=isText?'file':'image';
        // 上传到服务器
        await api('POST',`/api/sessions/${asid}/files`,{path:f.name,content:content,type:type});
        addAttachment({name:f.name,path:f.name,type:type,size:f.size});
        tln('sys',`📎 拖拽上传: ${f.name}`);
      }catch(err){alert('上传失败: '+f.name+' - '+err.message)}
    }
  });
})();

// ── P1: 文件浏览器 → 对话区 拖拽引用 ──
// 拖拽源：右侧文件浏览器的文件项（draggable）
function fiDragStart(ev,path,name,size){
  const payload=JSON.stringify({path,name,size:size||0});
  ev.dataTransfer.setData('text/x-bridge-file',payload);
  ev.dataTransfer.setData('text/plain','@'+path);  // 兜底：可粘贴到任意文本框
  ev.dataTransfer.effectAllowed='copy';
}

// 在输入框光标处插入文本
function insertAtCursor(text){
  const inp=$('inp');
  const start=inp.selectionStart??inp.value.length;
  const end=inp.selectionEnd??inp.value.length;
  inp.value=inp.value.substring(0,start)+text+inp.value.substring(end);
  const pos=start+text.length;
  inp.selectionStart=inp.selectionEnd=pos;
  inp.focus();
  // 触发高度自适应
  inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,100)+'px';
}

// 输入框作为放置目标：拖入文件 → 插入 @path 并加入附件
(function initInputDrop(){
  const inp=$('inp');
  // dragover 必须 preventDefault，drop 才会触发；同时给出 copy 视觉提示
  inp.addEventListener('dragover',e=>{
    if(e.dataTransfer.types.includes('text/x-bridge-file')){
      e.preventDefault();e.dataTransfer.dropEffect='copy';
    }
  });
  inp.addEventListener('drop',e=>{
    const payload=e.dataTransfer.getData('text/x-bridge-file');
    if(!payload)return;  // 非文件浏览器拖入，交给浏览器默认行为
    e.preventDefault();
    let info;try{info=JSON.parse(payload)}catch{return}
    if(!asid){alert('请先选择会话');return}
    // 与 @ 引用弹窗 pickAtFile 行为一致：插入 @path + 加入附件
    insertAtCursor('@'+info.path+' ');
    addAttachment({name:info.name,path:info.path,type:'file',size:info.size||0});
  });
})();

// ── P0: 粘贴图片 ──
function onPaste(e){
  const items=e.clipboardData?.items;
  if(!items)return;
  for(const item of items){
    if(item.type.startsWith('image/')){
      e.preventDefault();
      const file=item.getAsFile();
      if(!file||!asid)continue;
      const reader=new FileReader();
      reader.onload=async()=>{
        const name=`paste_${Date.now()}.png`;
        try{
          await api('POST',`/api/sessions/${asid}/files`,{path:name,content:reader.result,type:'image'});
          addAttachment({name:name,path:name,type:'image',size:file.size});
          tln('sys',`📎 粘贴图片: ${name}`);
        }catch(err){alert('粘贴上传失败: '+err.message)}
      };
      reader.readAsDataURL(file);
      return;
    }
  }
}

// ── P1: @ 引用弹窗 ──
function onInpInput(e){
  const val=e.target.value;
  const cur=e.target.selectionStart;
  // 查找光标前的 @ 符号
  const before=val.substring(0,cur);
  const atIdx=before.lastIndexOf('@');
  if(atIdx<0||(atIdx>0&&before[atIdx-1]!==' '&&before[atIdx-1]!=='\n')){
    hideAtPop();return;
  }
  // 提取 @ 后的查询文本
  const query=before.substring(atIdx+1);
  if(query.includes(' ')&&query.length>30){hideAtPop();return;}
  atPopQuery=query;
  showAtPop(query);
}
function showAtPop(q){
  atPopVisible=true;atPopSelIdx=0;
  $('atPop').classList.add('show');
  // 防抖搜索
  clearTimeout(atPopDebounce);
  if(q.length===0){
    $('atPop').innerHTML='<div class="hd">输入 @ 搜索文件，Esc 关闭</div><div class="empty">输入关键字搜索文件...</div>';
    return;
  }
  atPopDebounce=setTimeout(()=>searchFiles(q),200);
  $('atPop').innerHTML='<div class="hd">搜索中...</div>';
}
function hideAtPop(){
  atPopVisible=false;atPopQuery='';atPopResults=[];atPopSelIdx=0;
  $('atPop').classList.remove('show');
}
async function searchFiles(q){
  if(!asid||!q){hideAtPop();return;}
  try{
    const r=await api('GET',`/api/sessions/${asid}/files/search?q=${encodeURIComponent(q)}&limit=15`);
    atPopResults=r.results||[];
    if(!atPopResults.length){
      $('atPop').innerHTML=`<div class="hd">搜索结果</div><div class="empty">未找到匹配 "${esc(q)}" 的文件</div>`;
      return;
    }
    let html='<div class="hd">匹配文件 ('+atPopResults.length+')</div>';
    html+=atPopResults.map((f,i)=>{
      const ic=fileIcon(f.name);
      const sz=f.size?fmtSize(f.size):'';
      const sel=i===atPopSelIdx?' sel':'';
      return`<div class="fi${sel}" onclick="pickAtFile(${i})" onmouseenter="atPopSelIdx=${i};highlightAtSel()"><span class="ic">${ic}</span><span class="nm">${esc(f.name)}</span><span class="pth">${esc(f.path)}</span><span class="sz">${sz}</span></div>`;
    }).join('');
    $('atPop').innerHTML=html;
  }catch(e){
    $('atPop').innerHTML=`<div class="hd">搜索失败</div><div class="empty">${esc(e.message)}</div>`;
  }
}
function highlightAtSel(){
  const items=$('atPop').querySelectorAll('.fi');
  items.forEach((el,i)=>el.classList.toggle('sel',i===atPopSelIdx));
}
function pickAtFile(idx){
  const f=atPopResults[idx];
  if(!f)return;
  // 替换输入框中的 @query 为 @path
  const inp=$('inp');
  const val=inp.value;
  const cur=inp.selectionStart;
  const before=val.substring(0,cur);
  const atIdx=before.lastIndexOf('@');
  if(atIdx>=0){
    const after=val.substring(cur);
    inp.value=before.substring(0,atIdx)+'@'+f.path+' '+after;
    inp.selectionStart=inp.selectionEnd=atIdx+f.path.length+2;
  }
  // 添加到附件
  addAttachment({name:f.name,path:f.path,type:'file',size:f.size});
  hideAtPop();
  inp.focus();
}

// @ 弹窗键盘导航
document.addEventListener('keydown',function(e){
  if(!atPopVisible)return;
  if(e.key==='Escape'){hideAtPop();e.preventDefault();}
  else if(e.key==='ArrowDown'){atPopSelIdx=Math.min(atPopSelIdx+1,atPopResults.length-1);highlightAtSel();e.preventDefault();}
  else if(e.key==='ArrowUp'){atPopSelIdx=Math.max(atPopSelIdx-1,0);highlightAtSel();e.preventDefault();}
  else if(e.key==='Enter'&&atPopResults.length){pickAtFile(atPopSelIdx);e.preventDefault();e.stopPropagation();}
  else if(e.key==='Tab'&&atPopResults.length){pickAtFile(atPopSelIdx);e.preventDefault();e.stopPropagation();}
});

// 点击外部关闭 @ 弹窗
document.addEventListener('click',function(e){
  if(atPopVisible&&!$('atPop').contains(e.target)&&e.target!=$('inp')){hideAtPop();}
});
</script>
